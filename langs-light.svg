    <rect x="20" y="46" width="370" height="8" rx="4"/>
  </clipPath>
  <g clip-path="url(#bar-clip)">
    <rect x="20" y="46" width="162" height="8" fill="#3572A5"/>
    <rect x="183" y="46" width="60" height="8" fill="#f1e05a"/>
    <rect x="244" y="46" width="49" height="8" fill="#3178c6"/>
    <rect x="294" y="46" width="45" height="8" fill="#e34c26"/>
    <rect x="340" y="46" width="30" height="8" fill="#00ADD8"/>
