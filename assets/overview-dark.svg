    .label { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .val { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
  </style>
  <rect x="0.5" y="0.5" width="409" height="169" rx="6" fill="#0d1117" stroke="#30363d"/>
  
  <text x="20" y="30" class="title">Activity</text>
  <text x="390" y="30" text-anchor="end" class="sub">includes private</text>

