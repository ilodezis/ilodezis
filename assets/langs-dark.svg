<svg width="410" height="170" viewBox="0 0 410 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7d8590; }
    .lang { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .pct { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7d8590; }
  </style>
  <rect x="0.5" y="0.5" width="409" height="169" rx="6" fill="#0d1117" stroke="#30363d"/>
  
  <text x="20" y="30" class="title">Languages</text>
  <text x="390" y="30" text-anchor="end" class="sub">across 27 repos</text>

  <!-- Multi-segment bar (total width = 370) -->
  <clipPath id="bar-clip">
    <rect x="20" y="46" width="370" height="8" rx="4"/>
  </clipPath>
  <g clip-path="url(#bar-clip)">
    <rect x="20" y="46" width="206" height="8" fill="#3572A5"/>
    <rect x="227" y="46" width="69" height="8" fill="#f1e05a"/>
    <rect x="297" y="46" width="43" height="8" fill="#e34c26"/>
    <rect x="341" y="46" width="30" height="8" fill="#3178c6"/>
    <rect x="372" y="46" width="18" height="8" fill="#89e051"/>
  </g>

  <!-- Left column -->
  <circle cx="25" cy="80" r="4.5" fill="#3572A5"/>
  <text x="36" y="84"><tspan class="lang">Python</tspan> <tspan class="pct">55.8%</tspan></text>

  <circle cx="25" cy="108" r="4.5" fill="#f1e05a"/>
  <text x="36" y="112"><tspan class="lang">JavaScript</tspan> <tspan class="pct">18.7%</tspan></text>

  <circle cx="25" cy="136" r="4.5" fill="#e34c26"/>
  <text x="36" y="140"><tspan class="lang">HTML / CSS</tspan> <tspan class="pct">15.8%</tspan></text>

  <!-- Right column -->
  <circle cx="215" cy="80" r="4.5" fill="#3178c6"/>
  <text x="226" y="84"><tspan class="lang">TypeScript</tspan> <tspan class="pct">8.1%</tspan></text>

  <circle cx="215" cy="108" r="4.5" fill="#89e051"/>
  <text x="226" y="112"><tspan class="lang">Shell</tspan> <tspan class="pct">0.8%</tspan></text>

  <circle cx="215" cy="136" r="4.5" fill="#F05138"/>
  <text x="226" y="140"><tspan class="lang">Swift / C#</tspan> <tspan class="pct">0.8%</tspan></text>
</svg>
